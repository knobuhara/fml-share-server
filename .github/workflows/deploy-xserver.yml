name: Deploy Backend to Xserver (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, curl, ftp
          tools: composer

      - name: Validate PHP code
        run: |
          # Check PHP syntax in all files
          find . -name "*.php" -type f ! -path "./vendor/*" ! -path "./.github/*" -exec php -l {} \;

      - name: Prepare deployment package
        run: |
          # Create deployment directories
          mkdir -p deploy-package/fml-share-api/api
          mkdir -p deploy-package/fml-share-api/lib
          mkdir -p deploy-package/fml-share-api/config
          mkdir -p deploy-package/fml-share-api/public
          mkdir -p deploy-package/public_html/app
          
          # Copy only production-required files for backend
          cp -r api/* deploy-package/fml-share-api/api/
          cp -r lib/* deploy-package/fml-share-api/lib/
          cp -r config/* deploy-package/fml-share-api/config/
          cp public/index.php deploy-package/fml-share-api/public/
          
          # Copy .env from repository (contains non-sensitive settings)
          cp .env deploy-package/fml-share-api/.env
          
          # Append GitHub Secrets (sensitive settings only)
          cat >> deploy-package/fml-share-api/.env << 'EOF'
          
          # GitHub Secrets Overrides
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          XSERVER_HOST=${{ secrets.XSERVER_HOST }}
          XSERVER_USERNAME=${{ secrets.XSERVER_USERNAME }}
          XSERVER_PASSWORD=${{ secrets.XSERVER_PASSWORD }}
          EOF
          
          # Copy frontend entry point
          cp -r deploy/xserver/public_html/app/* deploy-package/public_html/app/

      - name: Deploy to Xserver via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.XSERVER_HOST }}
          username: ${{ secrets.XSERVER_DEPLOY_DIR_USER }}
          password: ${{ secrets.XSERVER_DEPLOY_DIR_PASSWORD }}
          local-dir: ./deploy-package/
          server-dir: /to-wer.co.jp/
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false

      - name: Verify API deployment
        run: |
          echo "✅ Backend deployment completed"
          echo "API Entry: https://bears.xsrv.jp/app/api/"
          echo "Deployed files:"
          echo "  - API: /fml-share-api/ (outside public_html)"
          echo "  - Public: /public_html/app/"

  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, curl, ftp
          tools: composer

      - name: Run PHP Linter
        run: |
          find . -name "*.php" -type f ! -path "./vendor/*" ! -path "./.github/*" -exec php -l {} \;

      - name: Check for syntax errors
        continue-on-error: true
        run: |
          php -d display_errors=1 -r "
          \$errors = 0;
          \$iterator = new RecursiveIteratorIterator(
            new RecursiveDirectoryIterator('.'),
            RecursiveIteratorIterator::LEAVES_ONLY
          );
          foreach (\$iterator as \$file) {
            if (\$file->getExtension() === 'php' && 
                strpos(\$file->getPath(), 'vendor') === false &&
                strpos(\$file->getPath(), '.github') === false) {
              @include \$file->getRealPath();
            }
          }
          exit(\$errors > 0 ? 1 : 0);
          "
